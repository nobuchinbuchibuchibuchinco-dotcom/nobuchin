<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>グラム換算 - 大さじ・小さじ早見表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: #fff7ee;
    color: #3a2f28;
    line-height: 1.5;
    padding-bottom: 40px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ff8a3d;
    padding: 12px 14px 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  header h1 {
    color: #fff;
    font-size: 18px;
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .search-box {
    position: relative;
  }
  #search {
    width: 100%;
    font-size: 18px;
    padding: 14px 44px 14px 16px;
    border: none;
    border-radius: 12px;
    outline: none;
    background: #fff;
    box-shadow: inset 0 0 0 2px transparent;
  }
  #search:focus { box-shadow: inset 0 0 0 2px #ffd2ad; }
  .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: #e0d6cd;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 16px;
    line-height: 26px;
    cursor: pointer;
    display: none;
  }
  .clear-btn.show { display: block; }
  .cats {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 10px 4px;
    -webkit-overflow-scrolling: touch;
  }
  .cat {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 20px;
    background: #ffe6d2;
    color: #c25c1c;
    font-size: 14px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    font-weight: bold;
  }
  .cat.active { background: #ff8a3d; color: #fff; }
  .count {
    text-align: center;
    font-size: 13px;
    color: #a08e80;
    margin: 6px 0 2px;
  }
  .list { padding: 8px 10px 0; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.07);
  }
  .card .name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #5a3d28;
  }
  .card .cat-tag {
    display: inline-block;
    font-size: 11px;
    background: #ffe6d2;
    color: #c25c1c;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: normal;
  }
  .rows {
    display: flex;
    gap: 8px;
  }
  .unit {
    flex: 1;
    text-align: center;
    background: #fff7ee;
    border-radius: 10px;
    padding: 8px 4px;
  }
  .unit .label {
    font-size: 12px;
    color: #a08e80;
    margin-bottom: 2px;
  }
  .unit .gram {
    font-size: 24px;
    font-weight: bold;
    color: #ff6a00;
  }
  .unit .gram .g {
    font-size: 13px;
    color: #c89b80;
    font-weight: normal;
    margin-left: 1px;
  }
  .unit .gram.none { font-size: 20px; color: #ccc; }
  .empty {
    text-align: center;
    color: #a08e80;
    padding: 40px 20px;
    font-size: 15px;
  }
</style>
</head>
<body>
<header>
  <h1>大さじ・小さじ → グラム換算</h1>
  <div class="search-box">
    <input id="search" type="text" inputmode="search" placeholder="食品名で検索（例：しょうゆ）" autocomplete="off">
    <button class="clear-btn" id="clear" aria-label="クリア">×</button>
  </div>
</header>

<div class="cats" id="cats"></div>
<div class="count" id="count"></div>
<div class="list" id="list"></div>

<script>
// data: [name, 小さじ1(g), 大さじ1(g), 1カップ200ml(g)], "-" は null
const CATS = ["液体調味料", "粉・香辛料", "油脂・砂糖・甘味", "飲み物・茶葉", "米"];
const DATA = [
  // 液体調味料
  ["水", 5, 15, 200, 0],
  ["酒", 5, 15, 200, 0],
  ["ワイン", 5, 15, 200, 0],
  ["酢", 5, 15, 200, 0],
  ["しょうゆ", 6, 18, 230, 0],
  ["本みりん", 6, 18, 230, 0],
  ["みりん風調味料", 6, 19, 250, 0],
  ["みそ", 6, 18, 230, 0],
  ["めんつゆ(ストレート)", 6, 18, 230, 0],
  ["めんつゆ(3倍希釈)", 7, 21, 240, 0],
  ["ポン酢しょうゆ", 6, 18, null, 0],
  ["焼き肉のたれ", 6, 18, null, 0],
  ["中濃ソース", 7, 21, 250, 0],
  ["分離型ドレッシング", 6, 17, null, 0],
  ["ノンオイルドレッシング", 5, 15, null, 0],
  ["豆板醤・甜麺醤", 7, 21, null, 0],
  ["コチュジャン", 7, 21, null, 0],
  ["オイスターソース", 6, 18, null, 0],
  ["ナンプラー", 6, 18, null, 0],
  // 粉・香辛料
  ["わさび粉", 2, 6, 70, 1],
  ["練りわさび", 5, 15, null, 1],
  ["カレー粉", 2, 6, 80, 1],
  ["からし粉", 2, 6, 90, 1],
  ["練りからし", 5, 15, null, 1],
  ["粒マスタード", 5, 15, null, 1],
  ["こしょう", 2, 6, 100, 1],
  ["脱脂粉乳", 2, 6, 90, 1],
  ["粉ゼラチン", 3, 9, 130, 1],
  ["粉寒天", 1, 3, null, 1],
  ["コーンスターチ", 2, 6, 100, 1],
  ["小麦粉(薄力・強力)", 3, 9, 110, 1],
  ["小麦粉(全粒粉)", 3, 9, 100, 1],
  ["米粉", 3, 9, 100, 1],
  ["片栗粉", 3, 9, 130, 1],
  ["上新粉", 3, 9, 130, 1],
  ["道明寺粉", 4, 12, 160, 1],
  ["ベーキングパウダー", 4, 12, 150, 1],
  ["重曹", 4, 12, 190, 1],
  ["生パン粉", 1, 3, 40, 1],
  ["うま味調味料", 4, 12, 160, 1],
  ["顆粒だしの素", 3, 9, null, 1],
  // 油脂・砂糖・甘味
  ["油・オリーブ油・ごま油", 4, 12, 180, 2],
  ["バター", 4, 12, 180, 2],
  ["マーガリン", 4, 12, 180, 2],
  ["ラード", 4, 12, 170, 2],
  ["ショートニング", 4, 12, 160, 2],
  ["上白糖(砂糖)", 3, 9, 130, 2],
  ["グラニュー糖", 4, 12, 180, 2],
  ["ざらめ", 5, 15, 200, 2],
  ["水あめ", 7, 21, 280, 2],
  ["はちみつ", 7, 21, 280, 2],
  ["メープルシロップ", 7, 21, 280, 2],
  ["ジャム", 7, 21, 250, 2],
  ["マーマレード", 7, 21, 270, 2],
  ["粗塩〈並塩〉・天然塩", 5, 15, 180, 2],
  ["食塩", 6, 18, 240, 2],
  ["精製塩", 6, 18, 240, 2],
  // 飲み物・茶葉
  ["番茶(茶葉)", 2, 6, 60, 3],
  ["煎茶(茶葉)", 2, 6, 90, 3],
  ["抹茶", 2, 6, 110, 3],
  ["紅茶(茶葉)", 2, 6, 60, 3],
  ["ココア(純ココア)", 2, 6, 90, 3],
  ["レギュラーコーヒー", 2, 6, 60, 3],
  ["昆布茶(粉末)", 2, 6, 90, 3],
  // 米
  ["胚芽精米・精白米（1合180ml=150g）", null, null, 170, 4],
  ["もち米（1合180ml=155g）", null, null, 175, 4],
  ["無洗米（1合180ml=160g）", null, null, 180, 4],
];

const searchEl = document.getElementById('search');
const clearEl = document.getElementById('clear');
const catsEl = document.getElementById('cats');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');

let activeCat = -1; // -1 = 全て

// カテゴリボタン生成
function buildCats() {
  catsEl.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'cat' + (activeCat === -1 ? ' active' : '');
  all.textContent = 'すべて';
  all.onclick = () => { activeCat = -1; buildCats(); render(); };
  catsEl.appendChild(all);
  CATS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'cat' + (activeCat === i ? ' active' : '');
    b.textContent = c;
    b.onclick = () => { activeCat = i; buildCats(); render(); };
    catsEl.appendChild(b);
  });
}

function gramHtml(label, val) {
  if (val === null) {
    return '<div class="unit"><div class="label">' + label + '</div>' +
           '<div class="gram none">—</div></div>';
  }
  return '<div class="unit"><div class="label">' + label + '</div>' +
         '<div class="gram">' + val + '<span class="g">g</span></div></div>';
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  clearEl.classList.toggle('show', q.length > 0);

  const items = DATA.filter(d => {
    if (activeCat !== -1 && d[4] !== activeCat) return false;
    if (q && !d[0].toLowerCase().includes(q)) return false;
    return true;
  });

  countEl.textContent = items.length + ' 件';

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty">該当する食品が見つかりません。<br>別のことばで探してみてください。</div>';
    return;
  }

  listEl.innerHTML = items.map(d => {
    return '<div class="card">' +
      '<div class="name">' + d[0] +
        '<span class="cat-tag">' + CATS[d[4]] + '</span>' +
      '</div>' +
      '<div class="rows">' +
        gramHtml('小さじ1<br>(5ml)', d[1]) +
        gramHtml('大さじ1<br>(15ml)', d[2]) +
        gramHtml('1カップ<br>(200ml)', d[3]) +
      '</div>' +
    '</div>';
  }).join('');
}

searchEl.addEventListener('input', render);
clearEl.addEventListener('click', () => { searchEl.value = ''; searchEl.focus(); render(); });

buildCats();
render();
</script>
</body>
</html>
